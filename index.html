<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>✨</title>
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <!-- Loading -->
  <div id="loading">
    <div class="loader">
      <div class="balloon-anim">🎈</div>
      <h2>Preparando la fiesta...</h2>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p id="loadingText">Cargando...</p>
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="scene"></canvas>

  <!-- YouTube Music (hidden iframe) -->
  <div id="ytContainer" class="yt-hidden">
    <iframe id="ytPlayer"
      src="https://www.youtube.com/embed/FE_KnGLsX5c?autoplay=0&enablejsapi=1&controls=0&disablekb=1&modestbranding=1&rel=0&loop=1&playlist=FE_KnGLsX5c&iv_load_policy=3"
      allow="autoplay"
      allowfullscreen
      playsinline
    ></iframe>
  </div>

  <!-- YouTube FX: gritos y aplausos (hidden iframe) -->
  <div id="fxContainer" class="yt-hidden">
    <iframe id="ytFxPlayer"
      src="https://www.youtube.com/embed/lHcgWdxR14A?autoplay=0&enablejsapi=1&controls=0&disablekb=1&modestbranding=1&rel=0&iv_load_policy=3"
      allow="autoplay"
      allowfullscreen
      playsinline
    ></iframe>
  </div>

  <!-- Hint de acción -->
  <div class="hint-chip" id="hintChip">🚪 Toca la puerta para entrar</div>

  <!-- Lector de cartas (siempre legible) -->
  <div id="readerOverlay" class="reader-overlay hidden">
    <div class="reader-card">
      <div class="reader-top">💖</div>
      <div class="reader-title" id="readerTitle">Para Yoselyn</div>
      <div class="reader-text" id="readerText"></div>
      <div class="reader-sign" id="readerSign"></div>
      <div class="reader-close">👆 Toca para cerrar</div>
    </div>
  </div>

  <!-- UI -->
  <div id="ui" class="hidden">
    <div class="top-bar">
      <div class="title">🎂 Mi Fiesta</div>
      <button class="icon-btn" id="btnFullscreen" title="Fullscreen">⛶</button>
    </div>

    <div class="wish-overlay hidden" id="wishOverlay"></div>
    <div class="wind-meter hidden" id="windMeter"><div class="wm-fill" id="windFill"></div></div>

    <div class="bottom-bar">
      <button class="ctrl-btn active" id="btnLights" title="Luces">✨</button>
      <button class="ctrl-btn" id="btnConfetti" title="Confeti">🎉</button>
    </div>
  </div>

  <!-- Three.js r160 + addons -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="scene.js?v=14"></script>
</body>
</html>
